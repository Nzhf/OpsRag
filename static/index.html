<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpsRAG - Manufacturing Ops Assistant</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f2f5; color: #1a1a2e; height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    background: #1a1a2e; color: #fff; padding: 14px 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 1.1rem; font-weight: 600; }
  header h1 span { color: #4fc3f7; }
  .mode-toggle { display: flex; gap: 8px; }
  .mode-toggle button {
    padding: 6px 14px; border-radius: 16px; border: 1px solid #4fc3f7;
    background: transparent; color: #4fc3f7; cursor: pointer; font-size: 0.85rem;
  }
  .mode-toggle button.active { background: #4fc3f7; color: #1a1a2e; font-weight: 600; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 78%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.92rem; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #1a73e8; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #dadce0; border-bottom-left-radius: 4px; }
  .msg.error { align-self: center; background: #fdecea; color: #b3261e; border: 1px solid #f5c6c2; }
  .tools { margin: 8px 0 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tool-chip {
    font-family: monospace; font-size: 0.75rem; background: #e8f0fe;
    color: #1a4d8f; padding: 3px 8px; border-radius: 10px; border: 1px solid #c6dafc;
  }
  details.sources { margin-top: 10px; font-size: 0.8rem; }
  details.sources summary { cursor: pointer; color: #1a73e8; font-weight: 600; }
  .source-item { background: #f8f9fa; border: 1px solid #e8eaed; border-radius: 6px; padding: 8px; margin-top: 6px; }
  .source-item .meta { color: #5f6368; font-size: 0.72rem; margin-bottom: 4px; }
  .source-item .meta b { color: #1a1a2e; }
  .source-item .excerpt { color: #3c4043; max-height: 90px; overflow-y: auto; }
  .typing { align-self: flex-start; color: #5f6368; font-style: italic; font-size: 0.85rem; }
  .typing::after { content: "..."; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  footer { padding: 14px 20px; background: #fff; border-top: 1px solid #dadce0; display: flex; gap: 10px; }
  #question {
    flex: 1; padding: 12px 16px; border: 1px solid #dadce0; border-radius: 24px;
    font-size: 0.95rem; outline: none;
  }
  #question:focus { border-color: #1a73e8; }
  #send {
    padding: 12px 22px; border: none; border-radius: 24px; background: #1a73e8;
    color: #fff; font-size: 0.95rem; cursor: pointer; font-weight: 600;
  }
  #send:hover { background: #1765cc; }
  #send:disabled { background: #9aa0a6; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>OpsRAG <span>|</span> Manufacturing Ops Assistant</h1>
  <div class="mode-toggle">
    <button id="btn-rag" class="active" onclick="setMode('rag')">Ask (RAG only)</button>
    <button id="btn-agent" onclick="setMode('agent')">Ask (Agent)</button>
  </div>
</header>
<div id="chat">
  <div class="msg assistant">Hi! Ask me about SOPs, inventory levels, or defect summaries for the BizLink Penang line. Switch between <b>RAG only</b> (semantic search + grounded answer) and <b>Agent</b> (model picks and calls tools) using the toggle above.</div>
</div>
<footer>
  <input id="question" type="text" placeholder="e.g. What are the ESD handling requirements? or: how much solder paste do we have left?"
         onkeydown="if(event.key==='Enter') send()">
  <button id="send" onclick="send()">Send</button>
</footer>
<script>
  let mode = 'rag';
  const chatDiv = document.getElementById('chat');
  const input = document.getElementById('question');
  const sendBtn = document.getElementById('send');

  function setMode(m) {
    mode = m;
    document.getElementById('btn-rag').classList.toggle('active', m === 'rag');
    document.getElementById('btn-agent').classList.toggle('active', m === 'agent');
  }

  function addMessage(cls, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.textContent = mode === 'agent' ? 'Thinking + calling tools' : 'Searching knowledge base';
    chatDiv.appendChild(div);
    chatDiv.scrollTop = chatDiv.scrollHeight;
    return div;
  }

  function renderSources(container, sources) {
    if (!sources || sources.length === 0) return;
    const details = document.createElement('details');
    details.className = 'sources';
    const summary = document.createElement('summary');
    summary.textContent = `Sources (${sources.length})`;
    details.appendChild(summary);
    sources.forEach(s => {
      const item = document.createElement('div');
      item.className = 'source-item';
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = `<b>${esc(s.doc_type)}</b> - ${esc(s.source_file)} (score ${s.score ?? 'n/a'})`;
      const excerpt = document.createElement('div');
      excerpt.className = 'excerpt';
      excerpt.textContent = s.excerpt || '';
      item.appendChild(meta);
      item.appendChild(excerpt);
      details.appendChild(item);
    });
    container.appendChild(details);
  }

  function renderToolCalls(container, toolCalls) {
    if (!toolCalls || toolCalls.length === 0) return;
    const wrap = document.createElement('div');
    wrap.className = 'tools';
    toolCalls.forEach(tc => {
      const chip = document.createElement('span');
      chip.className = 'tool-chip';
      const args = JSON.stringify(tc.arguments);
      chip.textContent = `${tc.name}(${args.length > 60 ? args.slice(0, 60) + '...' : args})`;
      wrap.appendChild(chip);
    });
    container.insertBefore(wrap, container.firstChild ? container.querySelector('details') : null);
    container.appendChild(wrap);
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  async function send() {
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    sendBtn.disabled = true;
    addMessage('user', q);
    const typing = addTyping();

    try {
      const endpoint = mode === 'agent' ? '/chat/agent' : '/chat/query';
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, top_k: 5 }),
      });
      if (!res.ok) throw new Error(`API error ${res.status}`);
      const data = await res.json();

      chatDiv.removeChild(typing);
      const msgDiv = addMessage('assistant', data.answer || '(empty response)');
      if (mode === 'agent') renderToolCalls(msgDiv, data.tool_calls);
      renderSources(msgDiv, data.sources);
    } catch (err) {
      chatDiv.removeChild(typing);
      addMessage('error', 'Request failed: ' + err.message);
    } finally {
      sendBtn.disabled = false;
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }
  }
</script>
</body>
</html>
